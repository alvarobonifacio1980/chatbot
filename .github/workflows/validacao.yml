name: Validação Chatbot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxe
        run: python -m compileall -q chat.py modelo_openai.py chat_core.py
      - name: Executar testes offline
        run: python -m unittest discover -s tests -v
